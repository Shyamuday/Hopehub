# Production stack: API + nginx (static SPAs + reverse proxy)
# Usage: from repo root after copying deploy/.env.production.example to deploy/.env
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: .env
    expose:
      - '4000'
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
