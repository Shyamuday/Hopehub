name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopehub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hopehub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hopehub_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: API install and generate
        working-directory: apps/api
        run: npm run prisma:generate

      - name: Apply and verify Prisma migrations
        working-directory: apps/api
        run: |
          npm run prisma:deploy
          npm run prisma:verify
          npm run release:verify
        env:
          NODE_ENV: test

      - name: Verify migration transaction policy
        working-directory: apps/api
        run: npm run prisma:safety

      - name: Typecheck all apps
        run: npm run typecheck

      - name: API tests
        working-directory: apps/api
        run: npm test

  validate:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/api
          - apps/user-web
          - apps/doctor-web
          - apps/admin-web
          - apps/operations-web
          - apps/healing-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prisma generate
        if: matrix.app == 'apps/api'
        working-directory: apps/api
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopehub_ci?schema=public

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopehub_ci?schema=public
          npm_config_legacy_peer_deps: ${{ matrix.app == 'apps/healing-web' && 'true' || '' }}

  test-angular:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/user-web
          - apps/doctor-web
          - apps/admin-web
          - apps/operations-web
          - apps/healing-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: ${{ matrix.app }}
        run: npm test -- --watch=false
