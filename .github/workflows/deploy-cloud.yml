name: Deploy Cloud

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to deploy: auto, all, patient, admin, doctor, operations, healing, api, or comma-separated list'
        required: false
        default: auto
      resolve_failed_migration:
        description: 'Optional failed Prisma migration to mark rolled back before an API deploy'
        required: false
        default: ''
      repair_failed_migration:
        description: 'Optional known partially-applied Prisma migration to repair before an API deploy'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'shared/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloud.yml'

concurrency:
  group: deploy-s3-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify release and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopehub_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hopehub_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hopehub_release?schema=public

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix apps/api

      - name: Apply migrations to a clean database
        run: npm run prisma:deploy --prefix apps/api

      - name: Verify migration/schema consistency
        run: npm run prisma:verify --prefix apps/api

      - name: Verify migration transaction policy
        run: npm run prisma:safety --prefix apps/api

      - name: Verify release migration history
        run: npm run release:verify --prefix apps/api
        env:
          NODE_ENV: test

      - name: Typecheck all applications
        run: npm run typecheck

      - name: Run API tests
        run: npm test --prefix apps/api

  deploy:
    name: Deploy frontends to S3
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deployment constants
        run: |
          set -a
          source deploy/config/production.env
          set +a
          {
            echo "AWS_REGION=${AWS_REGION}"
            echo "FRONTEND_BUCKET=${FRONTEND_BUCKET:-}"
            echo "FRONTEND_CLOUDFRONT_DISTRIBUTION_ID=${FRONTEND_CLOUDFRONT_DISTRIBUTION_ID:-}"
            echo "FRONTEND_CLOUDFRONT_FUNCTION_NAME=${FRONTEND_CLOUDFRONT_FUNCTION_NAME:-}"
            echo "LIGHTSAIL_HOST=${LIGHTSAIL_HOST}"
            echo "LIGHTSAIL_USER=${LIGHTSAIL_USER}"
            echo "LIGHTSAIL_APP_DIR=${LIGHTSAIL_APP_DIR}"
            echo "HOPEHUB_API_PUBLIC_URL=${HOPEHUB_API_PUBLIC_URL}"
            echo "HOPEHUB_WEB_ORIGIN=${HOPEHUB_WEB_ORIGIN}"
            echo "HOPEHUB_ADMIN_ORIGIN=${HOPEHUB_ADMIN_ORIGIN}"
            echo "HOPEHUB_DOCTOR_ORIGIN=${HOPEHUB_DOCTOR_ORIGIN}"
            echo "HOPEHUB_OPERATIONS_ORIGIN=${HOPEHUB_OPERATIONS_ORIGIN}"
            echo "HOPEHUB_HEALING_ORIGIN=${HOPEHUB_HEALING_ORIGIN}"
          } >> "$GITHUB_ENV"

      - name: Select apps to deploy
        id: select-apps
        shell: bash
        env:
          REQUESTED_APPS: ${{ github.event.inputs.apps || 'auto' }}
        run: |
          set -euo pipefail

          normalize_apps() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '
          }

          apps="$(normalize_apps "$REQUESTED_APPS")"
          patient=false
          admin=false
          doctor=false
          operations=false
          healing=false
          api=false

          select_all() {
            patient=true
            admin=true
            doctor=true
            operations=true
            healing=true
            api=true
          }

          select_from_list() {
            IFS=',' read -ra requested <<< "$1"
            for app in "${requested[@]}"; do
              case "$app" in
                user|user-web|patient|consumer) patient=true ;;
                admin|admin-web) admin=true ;;
                doctor|doctor-web) doctor=true ;;
                ops|operations|operations-web) operations=true ;;
                healing|healing-web) healing=true ;;
                api|backend|node|node-api) api=true ;;
                all) select_all ;;
                auto|'') ;;
                *) echo "Unknown app '$app'"; exit 1 ;;
              esac
            done
          }

          if [ "$apps" = "all" ]; then
            select_all
          elif [ "$apps" != "auto" ] && [ -n "$apps" ]; then
            select_from_list "$apps"
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              select_all
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base="HEAD^"
              fi
              changed="$(git diff --name-only "$base" "$head")"
              echo "$changed"

              if echo "$changed" | grep -Eq '^apps/user-web/'; then patient=true; fi
              if echo "$changed" | grep -Eq '^apps/admin-web/'; then admin=true; fi
              if echo "$changed" | grep -Eq '^apps/doctor-web/'; then doctor=true; fi
              if echo "$changed" | grep -Eq '^apps/operations-web/'; then operations=true; fi
              if echo "$changed" | grep -Eq '^apps/healing-web/'; then healing=true; fi
              if echo "$changed" | grep -Eq '^apps/api/'; then api=true; fi

              if echo "$changed" | grep -Eq '^(libs|shared|deploy/config|deploy/scripts|deploy/cloudfront|package\.json|package-lock\.json|\.github/workflows/deploy-cloud\.yml)'; then
                select_all
              fi
            fi
          fi

          selected=()
          [ "$patient" = true ] && selected+=("patient")
          [ "$admin" = true ] && selected+=("admin")
          [ "$doctor" = true ] && selected+=("doctor")
          [ "$operations" = true ] && selected+=("operations")
          [ "$healing" = true ] && selected+=("healing")
          [ "$api" = true ] && selected+=("api")
          frontend_selected=false
          if [ "$patient" = true ] || [ "$admin" = true ] || [ "$doctor" = true ] || [ "$operations" = true ] || [ "$healing" = true ]; then
            frontend_selected=true
          fi
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No frontend app changes detected."
            selected_csv=""
          else
            selected_csv="$(IFS=,; echo "${selected[*]}")"
          fi
          static_apps_csv="$selected_csv"
          if [ "$frontend_selected" = true ] && [ -n "${FRONTEND_BUCKET:-}" ]; then
            # Unified CloudFront serves every frontend from one bucket prefix.
            # Always rebuild/upload every frontend prefix so a partial deploy can
            # never leave a host (for example earn.hopehub.in -> /doctor) missing.
            static_apps_csv="patient,admin,doctor,operations,healing"
          fi

          {
            echo "patient=$patient"
            echo "admin=$admin"
            echo "doctor=$doctor"
            echo "operations=$operations"
            echo "healing=$healing"
            echo "api=$api"
            echo "frontend_selected=$frontend_selected"
            echo "selected=$selected_csv"
            echo "static_apps=$static_apps_csv"
          } >> "$GITHUB_OUTPUT"
          echo "HOPEHUB_STATIC_APPS=$static_apps_csv" >> "$GITHUB_ENV"
          echo "Selected apps: ${selected_csv:-none}"
          echo "Static apps to build/deploy: ${static_apps_csv:-none}"

      - name: Setup Node
        if: steps.select-apps.outputs.frontend_selected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        if: steps.select-apps.outputs.frontend_selected == 'true'
        run: npm ci

      - name: Configure production URLs
        if: steps.select-apps.outputs.frontend_selected == 'true'
        env:
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          DOCTOR_ORIGIN: ${{ secrets.DOCTOR_ORIGIN }}
          OPERATIONS_ORIGIN: ${{ secrets.OPERATIONS_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: bash deploy/scripts/configure-production-urls.sh

      - name: Build static frontends
        if: steps.select-apps.outputs.frontend_selected == 'true'
        run: bash deploy/scripts/build-static.sh

      - name: Verify static frontend identity markers
        if: steps.select-apps.outputs.frontend_selected == 'true'
        run: bash deploy/scripts/verify-frontend-deployment.sh local

      - name: Verify AWS deploy secrets
        if: steps.select-apps.outputs.frontend_selected == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=false
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS_ACCESS_KEY_ID is not visible to this workflow job."
            missing=true
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is not visible to this workflow job."
            missing=true
          fi
          if [ "$missing" = true ]; then
            echo "Check GitHub repo/environment secrets for environment 'production'."
            exit 1
          fi

      - name: Configure AWS credentials
        if: steps.select-apps.outputs.frontend_selected == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish unified CloudFront host router
        if: steps.select-apps.outputs.frontend_selected == 'true' && env.FRONTEND_BUCKET != '' && env.FRONTEND_CLOUDFRONT_FUNCTION_NAME != ''
        run: bash deploy/scripts/deploy-cloudfront-function.sh

      - name: Deploy selected frontends to unified S3 bucket
        if: steps.select-apps.outputs.frontend_selected == 'true' && env.FRONTEND_BUCKET != ''
        run: bash deploy/scripts/deploy-unified-frontends.sh

      - name: Verify unified frontend S3 uploads
        if: steps.select-apps.outputs.frontend_selected == 'true' && env.FRONTEND_BUCKET != ''
        run: bash deploy/scripts/verify-frontend-deployment.sh s3

      - name: Verify public frontend domains
        if: steps.select-apps.outputs.frontend_selected == 'true' && env.FRONTEND_BUCKET != ''
        run: bash deploy/scripts/verify-frontend-deployment.sh domain

  deploy-api:
    name: Deploy API on Lightsail
    runs-on: [self-hosted, hopehub-backend]
    needs: release-gate
    environment: production

    steps:
      - name: Checkout workflow context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The backend deployment script fetches the public repository from
          # /opt/hopehub itself. Avoid checkout's post-job credential cleanup
          # on the self-hosted runner, which can otherwise mark a completed
          # deployment as failed when its local Git state has changed.
          persist-credentials: false

      - name: Decide whether API deploy is needed
        id: api-changes
        shell: bash
        env:
          REQUESTED_APPS: ${{ github.event.inputs.apps || 'auto' }}
        run: |
          set -euo pipefail
          requested="$(echo "$REQUESTED_APPS" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          deploy=false

          case "$requested" in
            all|api|backend|node|node-api|*,api,*|api,*|*,api|*,backend,*|backend,*|*,backend) deploy=true ;;
          esac

          if [ "$requested" = "auto" ] || [ -z "$requested" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              deploy=true
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base="HEAD^"
              fi
              changed="$(git diff --name-only "$base" "$head")"
              echo "$changed"
              if echo "$changed" | grep -Eq '^(apps/(api|confession-bot|contact-bot|rules-bot)|libs|shared|deploy/config|deploy/scripts/(deploy-api-local|deploy-telegram-bots-local)\.sh|package\.json|package-lock\.json|\.github/workflows/deploy-cloud\.yml)'; then
                deploy=true
              fi
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "API deploy selected: $deploy"

      - name: Resolve failed Prisma migration
        if: steps.api-changes.outputs.deploy == 'true' && github.event.inputs.resolve_failed_migration != ''
        working-directory: /opt/hopehub/apps/api
        env:
          FAILED_MIGRATION: ${{ github.event.inputs.resolve_failed_migration }}
        run: |
          set -euo pipefail
          if [[ ! "$FAILED_MIGRATION" =~ ^[0-9]{14}_[a-z0-9_]+$ ]]; then
            echo "Invalid migration name."
            exit 1
          fi
          npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION"

      - name: Repair partially-applied Prisma migration
        if: steps.api-changes.outputs.deploy == 'true' && github.event.inputs.repair_failed_migration != ''
        working-directory: /opt/hopehub/apps/api
        env:
          FAILED_MIGRATION: ${{ github.event.inputs.repair_failed_migration }}
        run: |
          set -euo pipefail
          case "$FAILED_MIGRATION" in
            20260803143000_practice_library)
              npx prisma db execute --file prisma/recovery/20260803143000_practice_library.sql
              npx prisma migrate resolve --applied "$FAILED_MIGRATION"
              ;;
            *)
              echo "No repair procedure is defined for $FAILED_MIGRATION."
              exit 1
              ;;
          esac

      - name: Deploy API locally
        if: steps.api-changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TELEGRAM_USER_BOT_TOKEN: ${{ secrets.TELEGRAM_USER_BOT_TOKEN }}
          TELEGRAM_DOCTOR_BOT_TOKEN: ${{ secrets.TELEGRAM_DOCTOR_BOT_TOKEN }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_ADMIN_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ADMIN_ALERT_CHAT_IDS }}
          TELEGRAM_HOPEHUBBOT_TOKEN: ${{ secrets.TELEGRAM_HOPEHUBBOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_SETUP_SECRET: ${{ secrets.TELEGRAM_SETUP_SECRET }}
        run: bash deploy/scripts/deploy-api-local.sh

  notify-deployment-failure:
    name: Notify admin about failed deployment
    runs-on: ubuntu-latest
    environment: production
    needs: [release-gate, deploy, deploy-api]
    # A release gate can fail before the deploy jobs begin, so this must run
    # regardless of skipped dependencies. Alerting must never mask the
    # original deployment result.
    if: >-
      ${{ always() &&
          (needs.release-gate.result == 'failure' ||
           needs.deploy.result == 'failure' ||
           needs.deploy-api.result == 'failure') }}
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEPLOY_ALERT_CHAT_ID }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          FRONTEND_RESULT: ${{ needs.deploy.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Deployment alert was not sent: add TELEGRAM_DEPLOY_ALERT_CHAT_ID and ensure TELEGRAM_ADMIN_BOT_TOKEN is available as production secrets."
            exit 0
          fi

          text="<b>Hope Hub deployment needs attention</b>

          Release gate: ${RELEASE_GATE_RESULT}
          Frontend deploy: ${FRONTEND_RESULT}
          API deploy: ${API_RESULT}
          Commit: <code>${COMMIT_SHA}</code>

          <a href=\"${WORKFLOW_URL}\">Open GitHub Actions logs</a>"

          curl --fail --silent --show-error --retry 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode 'parse_mode=HTML' \
            --data-urlencode 'disable_web_page_preview=true'
