<section class="multi-select" [class.compact]="columns === 'one'" [class.tone-hope]="tone === 'hope'" [class.tone-neutral]="tone === 'neutral'">
  @if (label || hint) {
    <div class="multi-select__heading">
      @if (label) {
        <span class="multi-select__label">{{ label }}</span>
      }
      @if (hint) {
        <span class="multi-select__hint">{{ hint }}</span>
      }
    </div>
  }

  <div class="multi-select__summary" [class.empty]="!selectedOptions().length">
    @if (selectedOptions().length) {
      @for (option of selectedOptions(); track option.value) {
        <button type="button" class="multi-select__chip" (click)="remove(option.value, $event)">
          <span>{{ option.label }}</span>
          <span aria-hidden="true">×</span>
        </button>
      }
    } @else {
      <span>{{ placeholder }}</span>
    }
  </div>

  <div class="multi-select__grid" [class.one]="columns === 'one'" [class.two]="columns === 'two'">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="multi-select__option"
        [class.selected]="isSelected(option.value)"
        [disabled]="option.disabled"
        [attr.aria-pressed]="isSelected(option.value)"
        (click)="toggle(option.value)"
      >
        <span class="multi-select__check" aria-hidden="true">
          @if (isSelected(option.value)) {
            ✓
          }
        </span>
        <span class="multi-select__copy">
          <span class="multi-select__option-title">
            {{ option.label }}
            @if (option.badge) {
              <em>{{ option.badge }}</em>
            }
          </span>
          @if (option.helper) {
            <small>{{ option.helper }}</small>
          }
        </span>
      </button>
    }
  </div>
</section>
