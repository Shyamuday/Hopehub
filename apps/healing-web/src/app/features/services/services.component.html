<div class="container mx-auto px-4 py-8 sm:px-6 sm:py-10 lg:px-8">
  <h1 class="mb-3 text-center text-2xl font-semibold text-gray-950 sm:text-3xl">
    Services
  </h1>
  <app-continue-support-banner class="mb-6 block" [compact]="true" />

  <div class="group relative mb-4 inline-flex">
    <button type="button" class="rounded-full border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-bold text-amber-900">
      {{ notes.care.label }}
    </button>
    <div class="invisible absolute left-0 top-full z-20 mt-2 w-80 max-w-[calc(100vw-2rem)] rounded-lg border border-amber-200 bg-white p-3 text-sm leading-6 text-amber-900 opacity-0 shadow-xl transition group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100">
      {{ notes.care.text }}
    </div>
  </div>

  <app-filter-bar
    [showSearch]="false"
    [filters]="[
      {
        key: 'need',
        label: 'What do you need help with?',
        placeholder: 'Any need',
        value: searchTerm(),
        options: needOptions
      },
      {
        key: 'category',
        label: 'Service category',
        placeholder: 'All services',
        value: selectedFilter(),
        options: filters
      }
    ]"
    (filterChange)="handleFilterChange($event)"
  />

  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    @for (service of filteredServices(); track service.id) {
      <div class="cursor-pointer hope-animate-fade-up"
           (click)="navigateToService(service.id)">
        <app-service-card 
          [service]="service"
          [hidePricing]="true"
          [offerPrice]="singleSessionQuote()?.payableInPaise != null ? (singleSessionQuote()!.payableInPaise! / 100) : null"
          [originalPrice]="singleSessionQuote()?.grossInPaise != null ? (singleSessionQuote()!.grossInPaise! / 100) : null"
          [discountPercent]="singleSessionOffer()?.discountPercent || null"
          (learnMore)="navigateToService($event)">
        </app-service-card>
      </div>
    }
  </div>

  @if (!filteredServices().length) {
    <app-empty-state
      class="mt-6 block"
      icon="💛"
      title="No services matched"
      message="Try anxiety, relationship, sleep, family, or career."
    />
  }
</div>
