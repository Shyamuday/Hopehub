<section class="hope-section border-b border-gray-100">
  <div class="hope-section-inner">
    <div class="hope-section-header">
      <p class="hope-eyebrow">Services</p>
      <h2 class="hope-section-title">Mental health services</h2>
      <p class="hope-section-copy">
        Comprehensive support for your mental health journey with professional, compassionate
        care tailored to your unique needs.
      </p>
    </div>

    <div class="service-grid">
      @for (service of services(); track service.id) {
        <app-service-card
          [service]="service"
          [hidePricing]="true"
          (learnMore)="navigateToService($event)"
          class="transform hover:scale-105 transition-transform duration-200"
        />
      }
    </div>

    <div class="text-center mt-8 sm:mt-12">
      <button
        class="btn-primary btn-lg cta-button text-base sm:text-lg"
        routerLink="/services"
      >
        View All Services
      </button>
    </div>
  </div>
</section>
