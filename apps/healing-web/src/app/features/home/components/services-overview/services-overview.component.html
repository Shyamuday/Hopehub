<section class="hope-section border-b border-gray-100">
  <div class="hope-section-inner">
    <app-page-header
      eyebrow="Services"
      title="Mental health services"
      description="Comprehensive support for your mental health journey with professional, compassionate care tailored to your unique needs."
    />

    <div class="service-grid">
      @for (service of services(); track service.id) {
        <app-service-card
          [service]="service"
          [hidePricing]="true"
          (learnMore)="navigateToService($event)"
          class="transform hover:scale-105 transition-transform duration-200"
        />
      }
    </div>

    <div class="text-center mt-8 sm:mt-12">
      <app-button
        size="lg"
        [routerLink]="ROUTES.links.services"
      >
        View All Services
      </app-button>
    </div>
  </div>
</section>
