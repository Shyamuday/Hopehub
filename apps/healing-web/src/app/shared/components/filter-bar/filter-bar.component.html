<section class="filter-bar" [class.filter-bar--compact]="compact">
  @if (collapsible) {
    <div class="filter-bar__trigger-row">
      <button type="button" class="filter-bar__trigger" (click)="toggleExpanded()" [attr.aria-expanded]="expanded()">
        {{ expanded() ? 'Hide filters' : 'Refine results' }}
        @if (selectedFilters().length) { <span>{{ selectedFilters().length }}</span> }
      </button>
    </div>
  } @else {
    <p class="filter-bar__heading">Refine results</p>
  }

  @if (!collapsible || expanded()) {
  <div
    class="filter-bar__grid"
    [class.filter-bar__grid--dropdowns-only]="!showSearch"
    [style.--filter-count]="filters.length"
  >
    @if (showSearch) {
      <label class="filter-bar__field filter-bar__field--search">
        <span class="filter-bar__label">Search</span>
        <span class="filter-bar__search-wrap">
          <input
            type="text"
            [ngModel]="searchValue"
            (ngModelChange)="onSearch($event)"
            [placeholder]="searchPlaceholder"
            class="filter-bar__search"
          />
          <svg class="filter-bar__search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
      </label>
    }

    @for (filter of filters; track filter.key) {
      <label class="filter-bar__field">
        <span class="filter-bar__label">{{ filter.label }}</span>
        <app-form-dropdown
          [placeholder]="filter.placeholder || filter.label"
          [options]="filter.options"
          [ngModel]="filter.value"
          (ngModelChange)="onFilterChange(filter.key, $event)"
        />
      </label>
    }
  </div>
  }
  @if (selectedFilters().length) {
    <div class="filter-bar__selected" aria-label="Selected filters">
      @for (filter of selectedFilters(); track filter.key) {
        <button type="button" class="filter-bar__chip" (click)="clearFilter(filter.key)">
          {{ selectedLabel(filter) }} <span aria-hidden="true">×</span>
        </button>
      }
    </div>
  }
</section>
