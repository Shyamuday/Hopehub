<section class="filter-bar" [class.filter-bar--compact]="compact">
  <div
    class="filter-bar__grid"
    [class.filter-bar__grid--dropdowns-only]="!showSearch"
    [style.--filter-count]="filters.length"
  >
    @if (showSearch) {
      <label class="filter-bar__field filter-bar__field--search">
        <span class="filter-bar__label">Search</span>
        <span class="filter-bar__search-wrap">
          <input
            type="text"
            [ngModel]="searchValue"
            (ngModelChange)="onSearch($event)"
            [placeholder]="searchPlaceholder"
            class="filter-bar__search"
          />
          <svg class="filter-bar__search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
      </label>
    }

    @for (filter of filters; track filter.key) {
      <label class="filter-bar__field">
        <span class="filter-bar__label">{{ filter.label }}</span>
        <app-form-dropdown
          [placeholder]="filter.placeholder || filter.label"
          [options]="filter.options"
          [ngModel]="filter.value"
          (ngModelChange)="onFilterChange(filter.key, $event)"
        />
      </label>
    }
  </div>
</section>
