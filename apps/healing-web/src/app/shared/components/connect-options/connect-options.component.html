<section class="connect-options" [class.connect-options--compact]="compact">
  @if (!compact) {
    <div class="connect-options__head">
      <h3>{{ title }}</h3>
      <p>{{ subtitle }}</p>
    </div>
  }

  <div class="connect-options__grid" [class.connect-options__grid--compact]="compact">
    <button type="button" class="connect-options__button connect-options__button--primary" (click)="connectNow()">
      <span class="connect-options__icon">💛</span>
      <span>
        <strong>Connect now</strong>
        @if (!compact) {
          <small>Chat, voice, or video—use what feels comfortable.</small>
        }
      </span>
    </button>
    @if (showBook) {
      <button type="button" class="connect-options__button" (click)="selected.emit('book')">
        <span class="connect-options__icon">🗓️</span>
        <span>
          <strong>{{ bookLabel }}</strong>
          @if (!compact) {
            <small>Choose a convenient time.</small>
          }
        </span>
      </button>
    }
  </div>
</section>
