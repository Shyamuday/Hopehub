<section class="connect-fallback" [class.connect-fallback--compact]="compact">
  <button
    type="button"
    class="connect-fallback__close"
    aria-label="Hide these options"
    (click)="dismissed.emit()"
  >
    ×
  </button>
  <div class="connect-fallback__icon">🌙</div>
  <div class="connect-fallback__body">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>

    <div class="connect-fallback__actions">
      <a [routerLink]="ROUTES.links.bookSupport" [queryParams]="bookQueryParams" class="primary">
        Book a time
      </a>
      <a [routerLink]="ROUTES.links.careTeam" [queryParams]="careTeamQueryParams">
        See the care team
      </a>
      <a [routerLink]="ROUTES.links.liveGroups">Join community chat</a>
    </div>
  </div>
</section>
