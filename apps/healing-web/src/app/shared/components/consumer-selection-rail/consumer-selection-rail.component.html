<div class="consumer-selection-rail" role="list" [attr.aria-label]="ariaLabel">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="listitem"
      class="consumer-selection-rail__option"
      [class.consumer-selection-rail__option--selected]="selected === option.value"
      (click)="choose(option.value)"
    >
      @if (option.icon) { <span class="consumer-selection-rail__icon">{{ option.icon }}</span> }
      <span class="consumer-selection-rail__copy">
        <strong>{{ option.label }}</strong>
        @if (option.description) { <small>{{ option.description }}</small> }
      </span>
      @if (option.meta) { <span class="consumer-selection-rail__meta">{{ option.meta }}</span> }
    </button>
  }
</div>
