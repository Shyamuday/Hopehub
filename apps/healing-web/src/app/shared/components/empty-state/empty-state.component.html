<section
  class="empty-state"
  [class.empty-state--compact]="compact"
  [class.empty-state--soft]="tone === 'soft'"
  [class.empty-state--warning]="tone === 'warning'"
  [class.empty-state--danger]="tone === 'danger'"
>
  @if (showIcon) {
    <div class="empty-state__icon" aria-hidden="true">{{ icon }}</div>
  }
  @if (eyebrow) {
    <p class="empty-state__eyebrow">{{ eyebrow }}</p>
  }
  <h2>{{ title }}</h2>
  @if (message) {
    <p class="empty-state__message">{{ message }}</p>
  }
  <div class="empty-state__details">
    <ng-content select="[empty-details]" />
  </div>
  <div class="empty-state__actions">
    <ng-content />
  </div>
</section>
