<section class="guided-entry" [class.guided-entry--compact]="compact" aria-label="Guided support entry">
  <div class="guided-entry__head">
    <p>Guided start</p>
    <h2>{{ title }}</h2>
    <span>{{ subtitle }}</span>
  </div>

  <div class="guided-entry__body">
    <div class="guided-entry__group">
      <span class="guided-entry__label">What is closest today?</span>
      <div class="guided-entry__chips" role="list">
        @for (concern of concerns; track concern.key) {
          <app-selectable-card
            [title]="concern.shortLabel"
            [selected]="selectedConcern().key === concern.key"
            tone="brand"
            [compact]="true"
            (selectedChange)="selectConcern(concern)"
          />
        }
      </div>
    </div>

    <div class="guided-entry__group">
      <span class="guided-entry__label">How do you want to connect?</span>
      <div class="guided-entry__modes" role="list">
        @for (mode of modes; track mode.value) {
          <app-selectable-card
            [title]="mode.label"
            [description]="mode.hint"
            [selected]="selectedMode() === mode.value"
            tone="success"
            [compact]="true"
            (selectedChange)="selectMode(mode.value)"
          />
        }
      </div>
    </div>
  </div>

  <div class="guided-entry__summary">
    <span>{{ selectedSummary() }}</span>
  </div>

  <div class="guided-entry__actions">
    <app-button type="button" size="sm" (click)="start('live')">
      Talk now
    </app-button>
    <app-button type="button" variant="outline" size="sm" (click)="start('test')">Take matching test</app-button>
    <app-button type="button" variant="outline" size="sm" (click)="start('book')">Book slot</app-button>
    <app-button type="button" variant="secondary" size="sm" (click)="start('providers')">See providers</app-button>
  </div>
</section>
