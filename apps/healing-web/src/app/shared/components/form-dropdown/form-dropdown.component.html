<div class="form-dropdown" [class.form-dropdown--open]="isOpen" [class.form-dropdown--invalid]="invalid">
  <button
    #toggleButton
    type="button"
    class="form-dropdown__button"
    [disabled]="disabled"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="handleKeydown($event)"
  >
    <span class="form-dropdown__label" [class.form-dropdown__label--placeholder]="!value">
      {{ selectedLabel }}
    </span>
    <svg class="form-dropdown__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (isOpen) {
    <div class="form-dropdown__panel" [style.max-height]="panelMaxHeight" role="listbox">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="form-dropdown__option"
          [class.form-dropdown__option--selected]="option.value === value"
          role="option"
          [attr.aria-selected]="option.value === value"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
