<div class="quick-access">
  <button
    type="button"
    class="quick-access__main quick-access__main--chat"
    aria-label="Open Hope Hub support chat"
    title="Hope Hub chat — sign up only when you reply"
    (click)="openChatTeaser()">
    <svg class="quick-access__chat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M5.25 6.75A3.75 3.75 0 0 1 9 3h6a3.75 3.75 0 0 1 3.75 3.75v4.5A3.75 3.75 0 0 1 15 15H9.4l-3.2 3.05c-.47.45-1.2.12-1.2-.53V15A3.75 3.75 0 0 1 1.5 11.25v-4.5a3.75 3.75 0 0 1 3.75-3.75Z"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
      <path
        d="M8 8.25h8M8 11.25h5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
    @if (unreadCount() > 0) {
      <span class="quick-access__badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
    }
    <span class="quick-access__label">Hope Hub chat</span>
  </button>

  <a
    [href]="APP_CONSTANTS.TELEGRAM.GROUP_URL"
    target="_blank"
    rel="noopener noreferrer"
    class="quick-access__main quick-access__main--telegram"
    aria-label="Join the live Hope Hub Telegram chat"
    title="Join live Telegram chat">
    <svg class="quick-access__telegram-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.16-3.07-2.01 1.93c-.23.23-.42.43-.79.43z"
      />
    </svg>
    <span class="quick-access__label">Join live Telegram chat</span>
  </a>

  <!-- Other quick-access actions are paused for now:
    - Assessment: /assessments
    - WhatsApp: APP_CONSTANTS.WHATSAPP.GROUP_URL
    - Exercises: /exercises
    - Crisis Support modal
  -->

</div>

@if (showBottomQuickActions) {
<nav class="quick-action-bar" aria-label="Quick support actions">
  <a
    [routerLink]="ROUTES.links.home"
    [fragment]="ROUTES.fragments.liveConnect"
    class="quick-action-bar__item quick-action-bar__item--primary"
    [attr.aria-label]="UX.cta.talkNow"
    title="Talk now"
  >
    <svg class="quick-action-bar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5.5 18.5 6.8 15A7.5 7.5 0 1 1 19.5 9.5a7.5 7.5 0 0 1-10.7 6.75L5.5 18.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M8.5 9.75h.01M12 9.75h.01M15.5 9.75h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
    </svg>
    <strong>Talk</strong>
  </a>
  <a
    [routerLink]="ROUTES.links.bookSupport"
    class="quick-action-bar__item"
    aria-label="Book a support session"
    title="Book a session"
  >
    <svg class="quick-action-bar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8" />
      <path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <strong>Book</strong>
  </a>
  <a
    [routerLink]="ROUTES.links.assessments"
    class="quick-action-bar__item"
    aria-label="Take a self-check"
    title="Take a self-check"
  >
    <svg class="quick-action-bar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" />
      <path d="m14.9 9.1-1.8 4.1-4.1 1.8 1.8-4.1 4.1-1.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </svg>
    <strong>Test</strong>
  </a>
  <a
    [href]="APP_CONSTANTS.TELEGRAM.GROUP_URL"
    target="_blank"
    rel="noopener noreferrer"
    class="quick-action-bar__item"
    aria-label="Join the Hope Hub group"
    title="Join the group"
  >
    <svg class="quick-action-bar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M16.5 19.5v-1.25A3.75 3.75 0 0 0 12.75 14.5h-6A3.75 3.75 0 0 0 3 18.25v1.25M9.75 10.5a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5ZM17.5 4.4a3.25 3.25 0 0 1 0 6.15M21 19.5v-1.25a3.75 3.75 0 0 0-2.7-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <strong>Group</strong>
  </a>
</nav>
}
