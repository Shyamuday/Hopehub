@if (isOpen()) {
    <app-modal
        [open]="isOpen()"
        [labelledBy]="'authModalTitle'"
        panelClass="auth-card-shell"
        bodyClass="auth-card-body"
        (closed)="close()"
    >
        <h2 id="authModalTitle" class="sr-only">{{ modalLabel() }}</h2>

        @if (currentModal() === 'login') {
            <app-login></app-login>
        }
        @if (currentModal() === 'register') {
            <app-register></app-register>
        }
        @if (currentModal() === 'forgot-password') {
            <app-forgot-password></app-forgot-password>
        }
    </app-modal>
}
