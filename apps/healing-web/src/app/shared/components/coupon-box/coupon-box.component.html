<section
  class="coupon-box"
  [class.coupon-box--applied]="applied"
  aria-label="Coupon code"
  (keydown.enter)="applyFromKeyboard($event)"
>
  @if (suggestedCode) {
    <button
      type="button"
      class="coupon-box__offer"
      [class.coupon-box__offer--applied]="suggestedCouponApplied()"
      [disabled]="loading || disabled"
      (click)="useSuggestedCoupon()"
    >
      <span class="coupon-box__offer-copy">
        <small>Available offer</small>
        <strong>{{ suggestedLabel || suggestedCode }}</strong>
        @if (suggestedDescription) {
          <em>{{ suggestedDescription }}</em>
        }
      </span>
      <b>{{ suggestedCouponApplied() ? 'Applied' : 'Apply' }}</b>
    </button>
  }

  <div class="coupon-box__head">
    <div>
      <span>{{ title }}</span>
      <strong>{{ subtitle }}</strong>
    </div>
    @if (showClear && normalizedValue()) {
      <app-button
        type="button"
        variant="link"
        size="xs"
        [disabled]="loading"
        (click)="clear.emit()"
      >
        Clear
      </app-button>
    }
  </div>

  <div class="coupon-box__control">
    <app-form-field
      [placeholder]="placeholder"
      [modelValue]="value"
      [disabled]="loading || disabled"
      [uppercase]="true"
      customClass="coupon-box__input"
      (valueChange)="valueChange.emit($event)"
    />
    <app-button
      type="button"
      variant="secondary"
      [disabled]="!canApply()"
      [loading]="loading"
      (click)="apply.emit()"
    >
      {{ loading ? checkingLabel : applyLabel }}
    </app-button>
  </div>

  @if (success) {
    <p class="coupon-box__success">{{ success }}</p>
  }
  @if (error) {
    <p class="coupon-box__error">{{ error }}</p>
  }
  @if (helper) {
    <p>{{ helper }}</p>
  }
</section>
