<body>
  <app-root>
    <style>
      .app-shell-loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, Arial, sans-serif;
        color: #0f172a;
        background:
          radial-gradient(circle at 50% 18%, rgba(16, 185, 129, 0.14), transparent 260px),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }

      .app-shell-loading__brand {
        display: grid;
        justify-items: center;
        max-width: 520px;
        text-align: center;
      }

      .app-shell-loading__logo {
        width: 92px;
        height: 92px;
        border-radius: 28px;
        object-fit: cover;
        padding: 8px;
        background: #ffffff;
        box-shadow:
          0 22px 70px rgba(15, 23, 42, 0.14),
          0 0 0 1px rgba(16, 185, 129, 0.12);
      }

      .app-shell-loading strong {
        display: block;
        margin-top: 22px;
        font-size: clamp(44px, 10vw, 78px);
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      .app-shell-loading p {
        margin: 18px 0 0;
        max-width: 440px;
        color: #475569;
        font-size: clamp(17px, 3.5vw, 24px);
        font-weight: 700;
        line-height: 1.35;
      }

      .app-shell-loading__pulse {
        margin-top: 28px;
        width: 42px;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, #10b981, #0ea5e9);
        animation: hopehubShellPulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes hopehubShellPulse {
        from {
          opacity: 0.35;
          transform: scaleX(0.72);
        }

        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }
    </style>
    <div class="app-shell-loading" aria-label="Loading Hope Hub">
      <div class="app-shell-loading__brand">

          class="app-shell-loading__logo"

        />

  <!-- Font Loading Script - Non-blocking -->
  <script>
    // Initialize font loading class
    document.documentElement.classList.add('font-loading');
    
    // Remove loading class when fonts are ready
    if ('fonts' in document) {
      document.fonts.ready.then(function() {
        document.documentElement.classList.remove('font-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      // Fallback for browsers without FontFace API
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.documentElement.classList.remove('font-loading');
          document.documentElement.classList.add('fonts-loaded');
        }, 1000);
      });
    }
  </script>
